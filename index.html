    <style id="app-boot-guard">
      html.app-booting,
      html.app-booting body,
      html.app-booting #root {

      html.app-booting.app-booting-dark,

    <script>
      (() => {
        const pathname = window.location.pathname;
        const darkPrefixes = ['/test', '/search', '/my', '/login'];
        const usesDarkShell =
          pathname === '/' ||
          darkPrefixes.some((prefix) => pathname === prefix || pathname.startsWith(`${prefix}/`)) ||
          pathname === '/detail/past-life-goblin' ||
          pathname === '/detail/general-saju' ||
          pathname === '/detail/love-reading' ||
          pathname === '/terms' ||
          pathname === '/privacy' ||
          pathname === '/refund';

        document.documentElement.classList.add('app-booting');
        if (usesDarkShell) {
          document.documentElement.classList.add('app-booting-dark');
        }

        window.setTimeout(() => {
          document.documentElement.classList.remove('app-booting', 'app-booting-dark');
        }, 8000);
      })();
    </script>
